<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1, minimal-ui"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tom's Village" />
    <meta name="theme-color" content="#000000" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/apple-touch-icon.png" />
    <title>Tom's Village</title>
    <style>
      html,
      body {
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        background: #000;
        position: fixed;
        inset: 0;
        touch-action: none;
      }

      #game {
        display: block;
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      /* Virtual D-pad — thumb-sized, safe-area aware */
      #dpad {
        position: fixed;
        left: max(12px, env(safe-area-inset-left, 0px));
        bottom: calc(18px + env(safe-area-inset-bottom, 0px));
        width: 168px;
        height: 168px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.14);
        border: 2px solid rgba(255, 255, 255, 0.28);
        box-sizing: border-box;
        touch-action: none;
        z-index: 20;
        -webkit-user-select: none;
        user-select: none;
        transition: opacity 0.15s ease, transform 0.15s ease;
      }

      #dpad::before,
      #dpad::after {
        content: '';
        position: absolute;
        left: 50%;
        top: 50%;
        background: rgba(255, 255, 255, 0.12);
        transform: translate(-50%, -50%);
        pointer-events: none;
      }

      #dpad::before {
        width: 42px;
        height: 100%;
        border-radius: 10px;
      }

      #dpad::after {
        width: 100%;
        height: 42px;
        border-radius: 10px;
      }

      #dpad-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 58px;
        height: 58px;
        margin: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.32);
        border: 2px solid rgba(255, 255, 255, 0.42);
        transform: translate(-50%, -50%);
        pointer-events: none;
        box-sizing: border-box;
      }

      #dpad[data-dir='up'] #dpad-knob,
      #dpad[data-dir='down'] #dpad-knob,
      #dpad[data-dir='left'] #dpad-knob,
      #dpad[data-dir='right'] #dpad-knob {
        background: rgba(255, 255, 255, 0.5);
      }

      /* Talk / confirm — bottom-right */
      #btn-talk {
        position: fixed;
        right: max(16px, env(safe-area-inset-right, 0px));
        bottom: calc(28px + env(safe-area-inset-bottom, 0px));
        width: 84px;
        height: 84px;
        border-radius: 50%;
        border: 2px solid rgba(255, 230, 160, 0.65);
        background: rgba(90, 55, 20, 0.72);
        color: #ffe8a0;
        font: 700 15px "Courier New", monospace;
        letter-spacing: 0.04em;
        touch-action: manipulation;
        z-index: 20;
        -webkit-user-select: none;
        user-select: none;
        box-shadow: 0 5px 0 rgba(0, 0, 0, 0.4);
        transition: width 0.15s ease, height 0.15s ease, border-radius 0.15s ease,
          right 0.15s ease, bottom 0.15s ease, transform 0.08s ease;
        -webkit-appearance: none;
        appearance: none;
      }

      #btn-talk:active,
      #btn-talk[data-pressed='1'] {
        transform: translateY(3px);
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.4);
        background: rgba(130, 85, 30, 0.85);
      }

      #hint {
        position: fixed;
        left: 50%;
        top: calc(8px + env(safe-area-inset-top, 0px));
        transform: translateX(-50%);
        color: rgba(255, 240, 200, 0.8);
        font: 12px "Courier New", monospace;
        text-align: center;
        pointer-events: none;
        z-index: 15;
        text-shadow: 0 1px 3px #000;
        padding: 0 12px;
        max-width: calc(100vw - 24px);
        box-sizing: border-box;
      }

      #hint .desktop-only {
        display: none;
      }

      /* Dialogue mode: clear the D-pad, promote NEXT for thumbs */
      body.dialogue-open #dpad {
        opacity: 0;
        pointer-events: none;
        transform: scale(0.9);
      }

      body.dialogue-open #btn-talk {
        width: min(220px, calc(100vw - 48px));
        height: 56px;
        border-radius: 28px;
        right: 50%;
        transform: translateX(50%);
        bottom: calc(22px + env(safe-area-inset-bottom, 0px));
        font-size: 16px;
        letter-spacing: 0.08em;
      }

      body.dialogue-open #btn-talk:active,
      body.dialogue-open #btn-talk[data-pressed='1'] {
        transform: translateX(50%) translateY(3px);
      }

      body.dialogue-open #hint {
        opacity: 0;
      }

      /* Phones / touch-first: show mobile hint copy */
      @media (hover: none), (pointer: coarse) {
        #hint .mobile-only {
          display: inline;
        }
        #hint .desktop-only {
          display: none;
        }
      }

      @media (hover: hover) and (pointer: fine) {
        #hint .mobile-only {
          display: none;
        }
        #hint .desktop-only {
          display: inline;
        }
        /* Real mouse/trackpad desktops — keyboard is enough.
           iPhone / iPad still get the pad (coarse pointer or no hover). */
        #dpad,
        #btn-talk {
          display: none;
        }
      }

      /* Slightly compact controls on very small phones */
      @media (max-width: 390px) {
        #dpad {
          width: 148px;
          height: 148px;
        }
        #btn-talk {
          width: 76px;
          height: 76px;
        }
      }

      /* Landscape phone: keep controls reachable without covering center */
      @media (orientation: landscape) and (max-height: 500px) {
        #dpad {
          width: 128px;
          height: 128px;
          bottom: calc(8px + env(safe-area-inset-bottom, 0px));
        }
        #btn-talk {
          width: 64px;
          height: 64px;
          bottom: calc(16px + env(safe-area-inset-bottom, 0px));
          font-size: 13px;
        }
        body.dialogue-open #btn-talk {
          width: min(180px, calc(100vw - 40px));
          height: 44px;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hint">
      <span class="mobile-only">D-pad move · TALK to chat</span>
      <span class="desktop-only">Arrows / WASD move · Space / E talk</span>
    </div>
    <div id="dpad" aria-hidden="true">
      <div id="dpad-knob"></div>
    </div>
    <button id="btn-talk" type="button" aria-label="Talk">TALK</button>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
