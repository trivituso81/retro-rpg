<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1"
    />
    <title>Overworld</title>
    <style>
      html,
      body {
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        margin: 0;
        height: 100dvh;
        overflow: hidden;
        background: #000;
      }

      #game {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      /* Virtual D-pad — bottom-left over the game / safe area */
      #dpad {
        position: fixed;
        left: max(16px, env(safe-area-inset-left, 0px));
        bottom: calc(20px + env(safe-area-inset-bottom, 0px));
        width: 152px;
        height: 152px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.12);
        border: 2px solid rgba(255, 255, 255, 0.22);
        box-sizing: border-box;
        touch-action: none;
        z-index: 10;
        -webkit-user-select: none;
        user-select: none;
      }

      #dpad::before,
      #dpad::after {
        content: '';
        position: absolute;
        left: 50%;
        top: 50%;
        background: rgba(255, 255, 255, 0.1);
        transform: translate(-50%, -50%);
        pointer-events: none;
      }

      /* Cross shape hint */
      #dpad::before {
        width: 36px;
        height: 100%;
        border-radius: 8px;
      }

      #dpad::after {
        width: 100%;
        height: 36px;
        border-radius: 8px;
      }

      #dpad-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 52px;
        height: 52px;
        margin: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.28);
        border: 2px solid rgba(255, 255, 255, 0.35);
        transform: translate(-50%, -50%);
        pointer-events: none;
        box-sizing: border-box;
      }

      #dpad[data-dir='up'] #dpad-knob,
      #dpad[data-dir='down'] #dpad-knob,
      #dpad[data-dir='left'] #dpad-knob,
      #dpad[data-dir='right'] #dpad-knob {
        background: rgba(255, 255, 255, 0.45);
      }

      /* Hide pad only on mouse/trackpad desktops — iPads are often ≥900px wide. */
      @media (hover: hover) and (pointer: fine) {
        #dpad {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="dpad" aria-hidden="true">
      <div id="dpad-knob"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
